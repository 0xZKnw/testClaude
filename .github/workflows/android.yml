name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: stable
  PROJECT_DIR: game

jobs:
  # ---------------------------------------------------------------------------
  # Les tests tournent seuls et en premier : ils ne demandent ni SDK Android ni
  # templates d'export, donc ils échouent en une minute au lieu de dix.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download"
          NAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip "${BASE}/${GODOT_VERSION}-${GODOT_RELEASE}/${NAME}.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/${NAME} ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: |
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" --import

      - name: Unit tests
        run: |
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" \
            --script res://tests/run_tests.gd

      - name: Integration tests
        run: |
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" \
            res://tests/integration.tscn

  # ---------------------------------------------------------------------------
  # Build de l'APK. Aucun secret n'est nécessaire pour l'APK de debug : la clé
  # de signature debug est générée à la volée, comme le fait Android Studio.
  # ---------------------------------------------------------------------------
  apk:
    name: APK (debug)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-full-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          NAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"

          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${BASE}/${NAME}.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/${NAME} ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -fsSL -o /tmp/templates.tpz \
            "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates /tmp/tpl
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Generate debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore ~/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot-bin/godot --headless --path "$PROJECT_DIR" --import

      # Un build exporté n'embarque pas les mêmes fichiers que le projet ouvert
      # dans l'éditeur : ce contrôle attrape les données manquantes dans le
      # paquet, qui produiraient un APK qui démarre puis ne fait rien.
      - name: Smoke test on an exported build
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" \
            --export-debug "Linux" ../build/valdris.x86_64
          chmod +x build/valdris.x86_64
          OUT=$(./build/valdris.x86_64 --headless --quit-after 300 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "ERROR"; then
            echo "::error::Le build exporté remonte des erreurs au démarrage."
            exit 1
          fi

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot-bin/godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" ../build/valdris.apk
          ls -lh build/

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s build/valdris.apk
          "${ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt2" dump badging build/valdris.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: valdris-apk
          path: build/valdris.apk
          if-no-files-found: error
          retention-days: 30
