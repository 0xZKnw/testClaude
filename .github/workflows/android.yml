name: Build APK

on:
  push:
    branches:
      - claude/uno-ble-multiplayer-m6nnxx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A stuck compile must fail with logs, not burn the job's 6-hour ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A stable key is what lets the installed app be replaced rather than rejected.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uno-duo.jks"
            {
              echo "UNO_KEYSTORE_FILE=$RUNNER_TEMP/uno-duo.jks"
              echo "UNO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "UNO_KEY_ALIAS=${KEY_ALIAS:-unoduo}"
            } >> "$GITHUB_ENV"
            echo "Cle de signature restauree depuis les secrets du depot."
          else
            echo "Pas de secret de signature : utilisation de la cle versionnee dans keystore/."
          fi

      - name: Unit tests (game rules)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # The file keeps its old name on purpose: the installed app looks the release
      # asset up by exact name, so renaming it would break updating for everyone who
      # already has the app. Only what people read changed.
      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/uno-duo.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-duo-apk
          path: out/uno-duo.apk
          if-no-files-found: error

      - name: Publish a downloadable release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          SHORT="${GITHUB_SHA::7}"
          # The `sha=` line is the contract the in-app updater parses; printf keeps the
          # newlines out of the YAML block, which a literal blank line would have broken.
          NOTES=$(printf 'APK construit depuis `%s`. Installe-le sur chaque téléphone.\n\nsha=%s\n' "$SHORT" "$SHORT")
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/uno-duo.apk \
            --title "UNO — dernier APK" \
            --notes "$NOTES" \
            --prerelease

      # After the release on purpose: a lint error must be loud, but it must never
      # withhold an APK that builds and runs.
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Last so both results sit at the end of the log, where they are easy to find.
      - name: Verifications
        if: always()
        run: |
          echo "=== signature de l'APK ==="
          # apksigner and not `keytool -printcert -jarfile`: the APK carries a v2
          # signature only, which lives in the APK Signing Block, invisible to keytool.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner introuvable, signature non verifiee"
          else
            "$APKSIGNER" verify --print-certs out/uno-duo.apk | grep -i "SHA-256 digest" \
              || echo "aucun certificat lisible"
          fi
          echo "=== erreurs lint ==="
          REPORT=$(find app/build -name 'lint-results-debug.txt' 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "rapport lint absent"
          else
            grep -E ": Error:" "$REPORT" || echo "aucune erreur"
          fi
