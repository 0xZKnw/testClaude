name: Build APK

on:
  push:
    branches:
      - claude/uno-ble-multiplayer-m6nnxx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A stuck compile must fail with logs, not burn the job's 6-hour ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game rules)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/uno-duo.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-duo-apk
          path: out/uno-duo.apk
          if-no-files-found: error

      # Informational only: a lint nitpick must never withhold a working APK.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish a downloadable release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/uno-duo.apk \
            --title "UNO Duo — dernier APK" \
            --notes "APK construit depuis \`${GITHUB_SHA::7}\`. Installe-le sur les deux téléphones.

sha=${GITHUB_SHA::7}" \
            --prerelease
